# The part of the reload test that differs per module.  ci/reload.sh sources
# this with $WORK and $PORT already set and then drives the reloads.

"$(cd "$(dirname "$0")/.." && pwd)/ci/testdb.sh" "$WORK/test.mmdb" > /dev/null

RELOAD_HTTP="
    geoip2 $WORK/test.mmdb {
        \$probe_country_code source=\$http_x_probe_ip country iso_code;
    }"

RELOAD_SERVER="
        location /probe {
            return 200 \"\$probe_country_code\";
        }"

# 2.125.160.216 is in MaxMind's test database as GB, and it arrives in a
# header rather than as the peer address, so the lookup works from a
# loopback client.  The answer comes out of the opened database and through
# a variable this module registered: a reload that closed the database or
# lost the variable shows up as an empty body, which a status code alone
# would not catch.
RELOAD_EXPECT='GB'

reload_probe() {
	curl -s --max-time 5 -H 'X-Probe-IP: 2.125.160.216' \
		"http://127.0.0.1:$PORT/probe"
}
