name: Build & Test

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Monday morning, so a new nginx release that breaks the module shows
    # up here and not in somebody's build
    - cron: '7 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pins:
    name: pins
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A matrix is read before any step of its own job runs, so the release
    # list has to arrive from an earlier job.  Which releases, and why,
    # is written down in .github/versions.env.
    outputs:
      nginx: ${{ steps.read.outputs.nginx }}
      version: ${{ steps.read.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - id: read
        run: .github/scripts/pins.sh >> "$GITHUB_OUTPUT"

  suite:
    name: nginx ${{ matrix.nginx }}
    needs: pins
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        nginx: ${{ fromJSON(needs.pins.outputs.nginx) }}

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Fetch MaxMind's test database
        run: ci/testdb.sh t/data/GeoIP2-City-Test.mmdb

      - name: Build nginx ${{ matrix.nginx }}
        run: ci/build.sh '${{ matrix.nginx }}' "$HOME/nginx"

      - name: Run the test suite
        run: |
          # The block order is pinned.  Test::Nginx shuffles by default,
          # and a block that takes the server down is then reported
          # against whichever block happened to run after it.
          TEST_NGINX_NO_SHUFFLE=1 \
            TEST_NGINX_BINARY="$HOME/nginx/sbin/nginx" prove -r t/

      # Test::Nginx speaks HTTP, so the suite above never reaches
      # src/ngx_stream_geoip2_module.c.  This is that half's gate.
      - name: Exercise the stream module
        run: ci/stream.sh "$HOME/nginx/sbin/nginx" t/data/GeoIP2-City-Test.mmdb

  dynamic:
    name: loadable module
    needs: pins
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Fetch MaxMind's test database
        run: ci/testdb.sh t/data/GeoIP2-City-Test.mmdb

      - name: Build the module as a loadable object
        run: ci/build.sh '${{ needs.pins.outputs.version }}' "$HOME/nginx" dynamic

      - name: Run the test suite against the loaded modules
        run: |
          mods=
          for so in "$HOME"/nginx/modules/*.so; do
            mods="$mods $so"
          done
          echo "loading:$mods"
          TEST_NGINX_LOAD_MODULES="$mods" \
            TEST_NGINX_NO_SHUFFLE=1 \
            TEST_NGINX_BINARY="$HOME/nginx/sbin/nginx" prove -r t/

      # A loadable build has to produce both objects, and the stream one
      # has to work when loaded on its own.
      - name: Exercise the loaded stream module
        run: |
          so=$HOME/nginx/modules/ngx_stream_geoip2_module.so
          test -f "$so" || {
            echo "the loadable build did not produce $so" >&2
            ls -l "$HOME/nginx/modules" >&2
            exit 1
          }
          STREAM_LOAD_MODULE=$so \
            ci/stream.sh "$HOME/nginx/sbin/nginx" t/data/GeoIP2-City-Test.mmdb
